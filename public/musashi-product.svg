<path d="M144 212 Q360 180 576 212" fill="none" stroke="#7b8086" stroke-opacity=".45" stroke-width="4"/>
<path d="M148 235 V690 M570 235 V690" stroke="#fff" stroke-opacity=".08" stroke-width="5"/>
<!-- grunge mark -->
<path d="M390 470 l120 -35 -45 75 82 -22 -90 120 50 5 -115 110 32 -87 -64 12 65 -91 -57 8 76 -95 -62 15Z" fill="#7b8087" opacity=".18"/>
<path d="M410 480 l112 -30 -65 90 77 -20 -110 125 22 -75 -70 14 82 -99 -61 12Z" fill="url(#metal)" opacity=".22"/>
<path d="M395 500 l180 -70 M420 545 l135 -40 M400 600 l150 -50 M420 655 l100 -34" stroke="#b8bdc2" stroke-opacity=".12" stroke-width="7"/>
