 <text x="360" y="330" font-size="69" font-weight="900" letter-spacing="3" fill="url(#red)">MUSASHI<tspan font-size="17" baseline-shift="super">®</tspan></text>
 <text x="255" y="388" font-size="25" font-weight="900" font-style="italic" fill="#9da2a8" text-anchor="start">RECOVER</text>
 <text x="360" y="445" font-size="47" font-weight="900" font-style="italic" fill="#fff">HIGH PROTEIN</text>
 <text x="360" y="498" font-size="53" font-weight="900" font-style="italic" fill="#fff">+ CREATINE</text>
 <text x="360" y="533" font-size="16" font-weight="700" letter-spacing="1" fill="#d5d8dc">PROTEIN &amp; CREATINE BLEND</text>
 <path d="M240 550 H480" stroke="#aeb2b8" stroke-width="2" opacity=".8"/>
 <text x="270" y="601" font-size="37" font-weight="900" fill="#fff">30G</text>
 <text x="270" y="625" font-size="14" font-weight="700" fill="#e3e5e7">PROTEIN</text>
 <path d="M320 570 V635" stroke="#aeb2b8" stroke-width="2"/>
 <text x="360" y="601" font-size="37" font-weight="900" fill="#fff">19</text>
 <text x="360" y="625" font-size="14" font-weight="700" fill="#e3e5e7">SERVES</text>
 <path d="M400 570 V635" stroke="#aeb2b8" stroke-width="2"/>
 <text x="452" y="590" font-size="15" font-weight="900" fill="#fff">FOR MUSCLE</text>
 <text x="452" y="610" font-size="15" font-weight="900" fill="#fff">REPAIR AND</text>
 <text x="452" y="630" font-size="15" font-weight="900" fill="#fff">RECOVERY*</text>
</g>
<path d="M235 660 H365 V710 H235Z" fill="#a84a21" stroke="#e06a37" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#fff" font-weight="900">
 <text x="300" y="681" font-size="17">CHOCOLATE</text><text x="300" y="701" font-size="17">FLAVOUR</text>
</g>
<text x="530" y="725" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="end">900G</text>
