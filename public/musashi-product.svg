<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" aria-labelledby="title desc">
<title id="title">MUSASHI Recover High Protein and Creatine 900 gram tub</title>
<desc id="desc">Black cylindrical MUSASHI supplement tub with a glossy black screw lid and red, white and grey label, isolated on a transparent background.</desc>
<defs>
 <linearGradient id="cap" x1="0" x2="1"><stop stop-color="#050608"/><stop offset=".13" stop-color="#55585d"/><stop offset=".24" stop-color="#101216"/><stop offset=".52" stop-color="#34373c"/><stop offset=".76" stop-color="#08090b"/><stop offset=".9" stop-color="#4c5055"/><stop offset="1" stop-color="#060709"/></linearGradient>
 <linearGradient id="body" x1="0" x2="1"><stop stop-color="#030405"/><stop offset=".12" stop-color="#292c30"/><stop offset=".27" stop-color="#08090b"/><stop offset=".52" stop-color="#191c20"/><stop offset=".75" stop-color="#050608"/><stop offset=".9" stop-color="#282b30"/><stop offset="1" stop-color="#020304"/></linearGradient>
 <linearGradient id="shoulder" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4b4e53"/><stop offset=".18" stop-color="#121417"/><stop offset=".7" stop-color="#050608"/><stop offset="1" stop-color="#282b30"/></linearGradient>
 <linearGradient id="base" x1="0" x2="1"><stop stop-color="#050608"/><stop offset=".18" stop-color="#383b40"/><stop offset=".45" stop-color="#111317"/><stop offset=".8" stop-color="#292c31"/><stop offset="1" stop-color="#030405"/></linearGradient>
 <linearGradient id="label" x1="0" x2="1"><stop stop-color="#050608"/><stop offset=".2" stop-color="#17191d"/><stop offset=".55" stop-color="#08090b"/><stop offset=".82" stop-color="#1d2025"/><stop offset="1" stop-color="#050608"/></linearGradient>
 <linearGradient id="red" x1="0" x2="1"><stop stop-color="#d90012"/><stop offset=".5" stop-color="#ff1729"/><stop offset="1" stop-color="#c90011"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#3b3e43"/><stop offset=".5" stop-color="#9ba0a6"/><stop offset="1" stop-color="#25282d"/></linearGradient>
 <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%"><feGaussianBlur stdDeviation="17"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="11"/><feColorMatrix values="1 0 0 0 .2 0 1 0 0 .2 0 0 1 0 .2 0 0 0 .14 0"/></filter>
 <clipPath id="bodyClip"><path d="M135 210 Q135 160 190 145 L530 145 Q585 160 585 210 L585 710 Q585 770 520 785 L200 785 Q135 770 135 710Z"/></clipPath>
</defs>
<ellipse cx="365" cy="795" rx="250" ry="27" fill="#000" opacity=".42" filter="url(#shadow)"/>
<!-- screw cap -->
<path d="M218 64 Q218 38 250 30 L470 30 Q502 38 502 64 L502 144 L218 144Z" fill="url(#cap)" stroke="#686d73" stroke-width="3"/>
<path d="M222 69 H498 M222 80 H498 M222 118 H498 M222 130 H498" stroke="#aeb2b8" stroke-opacity=".4" stroke-width="3"/>
<path d="M236 38 V137 M250 34 V139 M270 32 V140 M450 32 V140 M470 34 V139 M484 38 V137" stroke="#fff" stroke-opacity=".12" stroke-width="5"/>
<path d="M217 140 Q360 153 503 140 L503 163 Q360 177 217 163Z" fill="#08090b" stroke="#555a60" stroke-width="3"/>
<!-- rounded tub -->
<path d="M135 210 Q135 160 190 145 Q360 120 530 145 Q585 160 585 210 L585 710 Q585 770 520 785 L200 785 Q135 770 135 710Z" fill="url(#body)" stroke="#51565c" stroke-width="4"/>
