<path d="M137 702 Q360 730 583 702 L583 728 Q580 774 520 785 L200 785 Q140 774 137 728Z" fill="url(#base)" stroke="#60656b" stroke-width="3"/>
<path d="M150 720 Q360 746 570 720" fill="none" stroke="#b7bcc2" stroke-opacity=".25" stroke-width="3"/>
<path d="M205 775 Q360 798 515 775" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="4"/>
<!-- studio glints -->
<path d="M160 230 Q155 450 160 665" stroke="#fff" stroke-opacity=".08" stroke-width="7" fill="none"/>
<path d="M560 245 Q565 450 560 660" stroke="#fff" stroke-opacity=".12" stroke-width="6" fill="none"/>
<rect x="0" y="0" width="720" height="840" filter="url(#grain)" opacity=".18" clip-path="url(#bodyClip)"/>
