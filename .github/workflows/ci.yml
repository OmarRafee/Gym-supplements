name: Storefront CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/storefront-motion-commerce-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://vgzeogxtthydojmvybrb.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
